[project]
name = "lending-worker"
version = "0.1.0"
description = "備品貸出管理システム - バッチ処理"
requires-python = ">=3.12"
dependencies = [
    "lending-core",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lending_worker"]

[tool.uv.sources]
lending-core = { workspace = true }
