[project]
name = "lending-api"
version = "0.1.0"
description = "備品貸出管理システム - API"
requires-python = ">=3.12"
dependencies = [
    "lending-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lending_api"]

[tool.uv.sources]
lending-core = { workspace = true }
