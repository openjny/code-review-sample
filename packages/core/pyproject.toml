[project]
name = "lending-core"
version = "0.1.0"
description = "備品貸出管理システム - ドメイン層"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lending_core"]
